name: Build Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  TARGET: x86_64-pc-windows-msvc

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}

      - name: Build
        env:
          RUSTFLAGS: "-C target-cpu=tigerlake -C target-feature=+crt-static"
        run: cargo build --release --target $env:TARGET

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: flac2m4a-tigerlake-x64
          path: target/${{ env.TARGET }}/release/flac2m4a.exe
          if-no-files-found: error

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: target/${{ env.TARGET }}/release/flac2m4a.exe
